<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HearSay</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark">
<!-- Installed on an iPhone home screen this becomes the whole app: no Safari
     chrome, its own audio session, and the service worker keeps it opening with
     no network at all. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- `black`, not `black-translucent`. Apple's documented difference is where
     the page starts: `black-translucent` lays it out from the top of the
     *screen*, behind the status bar, and `black` is supposed to inset the web
     view itself so it starts under the bar and reaches the true bottom.

     What an installed iPhone was doing instead, read off a screenshot of it
     (the top bar sat one status bar down, and the player bar one status bar
     up): it laid the page out edge to edge and then handed it a layout
     viewport one status bar SHORTER than the screen. So `100dvh` ended
     ~59px above the bottom edge and everything anchored there - the player bar,
     the drawer - stopped with a dead black band under it. That is not a thing
     this file can fix, and both spellings of the meta tag walk into it; it is
     fixed in index.css with `--vh-extra`, which measures the shortfall rather
     than assuming it, and is 0 on a device or a browser that does not have it.
     Read the scaffold comment there before touching this tag.

     viewport-fit=cover stays: it is what makes env() nonzero at all, and every
     `max(0.5rem, var(--sab))` floor in index.css simply stands on the rem where
     the insets read 0.
     NOTE: iOS caches this tag at *install* time - an icon already on the home
     screen has to be removed and re-added before a change to it is visible,
     which is also why the value here is not evidence of how the phone in your
     hand is laid out. The drawer's diagnostics line is: it prints the viewport,
     the screen, the insets and the fill actually being applied. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HearSay">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&display=swap">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
