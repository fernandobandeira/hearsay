<!doctype html>
<html lang="en" class="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HearSay</title>
<meta name="theme-color" content="#0a0a0a">
<meta name="color-scheme" content="dark">
<!-- Installed on an iPhone home screen this becomes the whole app: no Safari
     chrome, its own audio session, and the service worker keeps it opening with
     no network at all. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- `black`, not `black-translucent`, and the bottom of the screen is why.
     With black-translucent an installed iOS app is laid out from the top of the
     screen but handed a viewport one status bar *shorter* than the screen, so
     the page ends ~59pt above the bottom edge and everything fixed to that edge
     - the player bar, the drawer, the overlay - stops there, with the strip
     below painted by the system in the background colour. `black` lets iOS
     inset the web view itself: it starts under the status bar and reaches the
     true bottom. The status bar strip is then the system's to paint, which on a
     #0a0a0a app is the same colour it was.

     viewport-fit=cover stays: in this mode the insets read 0 and every
     `max(0.5rem, var(--sab))` floor in index.css simply stands on the rem.
     NOTE: iOS caches this at *install* time - an icon already on the home
     screen has to be removed and re-added before the change is visible. -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="HearSay">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500&display=swap">
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
