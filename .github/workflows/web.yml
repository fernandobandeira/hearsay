# Build the reader and publish it as a *content* image: ghcr.io/…/hearsay-web,
# a scratch image whose whole filesystem is /dist. The box's
# hearsay-web-update.timer pulls it every ten minutes and lays the files into
# /home/ubuntu/web, which the server mounts read-only over the copy baked into
# its own image. So a UI change ships in minutes without recompiling the server.
#
# Two architectures, because the box is arm64 and a matching manifest spares it
# a --platform flag; the node stage is pinned to $BUILDPLATFORM (see
# web/Dockerfile), so it runs once natively and the second manifest is metadata.
name: web

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/web.yml'
  workflow_dispatch:

# One run per branch. Fernando pushes in bursts (seventeen runs in three hours
# on 2026-09-11); without this a superseded push keeps a free amd64 runner, a
# free arm64 runner and a four-minute cache export busy for nothing, and two
# runs race to write the same buildx cache scope.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}-web

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --no-audit --no-fund
      - run: npm --prefix web test
      # `npm exec` ignores --prefix for the working directory; the package's own
      # script does not, and it is the same `tsc -b --force`.
      - run: npm --prefix web run typecheck
      # The other half of the contract gate (release.yml has the one that needs
      # cargo): regenerate the client from the *committed* openapi.json and fail
      # if it differs. A hand-edited generated client is the one way the reader's
      # types can drift from the server without anything noticing.
      - run: ./scripts/gen-client.sh --from-spec --check
      - run: npm --prefix web run build

  build:
    # Same rule as the server: the image only exists on green.
    needs: [test]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:latest
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
