# Build the multi-arch image on every push to master and publish it to GHCR.
# Both architectures build natively (GitHub's free arm64 runners for public
# repos) - no QEMU, so the Rust + whisper.cpp compile stays fast. The box then
# deploys with a plain `docker pull ghcr.io/fernandobandeira/hearsay:latest`.
name: release

on:
  push:
    branches: [master]
    # The reader has its own image and its own workflow (web.yml). A UI-only
    # push has no business spending an hour recompiling whisper.cpp twice - and
    # the box would not pick the result up anyway: it reads the reader from the
    # hearsay-web image, not from this one. The server image still *builds*
    # web/ (its Dockerfile's node stage), so the fallback baked into it is
    # whatever the tree held at the last server build. That is the point of a
    # fallback.
    paths-ignore:
      - 'web/**'
  workflow_dispatch:

# One run per branch. Fernando pushes in bursts (seventeen runs in three hours
# on 2026-09-11); without this a superseded push keeps a free amd64 runner, a
# free arm64 runner and a four-minute cache export busy for nothing, and two
# runs race to write the same buildx cache scope.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}
  # Pinned at the workflow level, not per-step, because Swatinem/rust-cache
  # hashes every CARGO_*/RUST* variable into its key: a value that appears and
  # disappears between steps or jobs is a cache that never hits.
  CARGO_TERM_COLOR: always
  # Full DWARF for a tree nothing will ever attach a debugger to. Line tables
  # keep test-failure backtraces readable and cut the object files (and so the
  # link, and so the cache) by most of their size. CI-only: local `cargo test`
  # is untouched, because this lives here and not in Cargo.toml.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # An empty wrapper on purpose: a wrapper leaking in from a runner image would
  # change -C metadata and invalidate the restored cache wholesale.
  RUSTC_WRAPPER: ""

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          # A fixed key instead of the job name, so splitting or renaming this
          # job later does not orphan a gigabyte of cache on the old name.
          shared-key: ci
          # A run that fails in clippy still paid for the dependency build; save
          # it, or the next push pays again.
          cache-on-failure: true
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The reader too: the server image's node stage builds web/, so a reader
      # that does not typecheck is a server image that does not build.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --no-audit --no-fund
      - run: npm --prefix web test
      # `npm exec` ignores --prefix for the working directory; the package's own
      # script does not, and it is the same `tsc -b --force`.
      - run: npm --prefix web run typecheck
      # The contract gate. openapi.json and web/src/client are *generated* - from
      # the handlers, through utoipa, through openapi-ts - and the reader has no
      # other description of this API. So a response shape that changed in Rust
      # without being carried through here is a red build rather than a reader
      # that compiles and quietly misreads a field. The debug binary prints the
      # same document as the release one, and cargo test above already built it.
      - run: cargo build --bin narrator
      - run: NARRATOR_BIN="$PWD/target/debug/narrator" ./scripts/gen-client.sh --check

  build:
    # Deliberately no `needs: [test]`. The gate has not moved - it has moved
    # *down*, to `publish`, and it is stricter there than it was here.
    #
    # Nothing in this job is tagged. Each architecture pushes an untagged
    # digest (push-by-digest), which no `docker pull` can reach: the box pulls
    # ghcr.io/fernandobandeira/hearsay:latest, and the only step that creates
    # that tag is `publish`, which needs [test, build]. So a red test still
    # means no tag ever appears - while the four minutes of compiling happen
    # *during* the two minutes of testing instead of after them.
    #
    # The cost of being wrong is a few orphan untagged manifests in GHCR on a
    # red run; `gh api --method DELETE .../versions/<id>` or the package's
    # retention settings sweep those.
    strategy:
      # An arm64 failure should not shoot the amd64 job you were about to read
      # the log of.
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          # push-by-digest: the layers land in GHCR, the manifest is addressable
          # only by its own sha256, and no tag points at it. `publish` turns the
          # two digests into one tag once the tests are green.
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          # The build cache lives in GHCR, not in the Actions cache.
          #
          # Measured 2026-09-12: the Actions cache held 3.81 GB of buildkit
          # blobs against a 10 GB repo cap it shares with the 1.03 GB rust-cache
          # entry, and since November 2025 GitHub evicts LRU *hourly* - so the
          # image cache was on its way to evicting the Rust cache. Worse, the
          # gha backend rewrites every blob on every run: exporting cost 78s on
          # amd64 and 47s on arm64 even when the only thing that changed was one
          # .rs file. A registry backend skips blobs the registry already has by
          # digest, so an unchanged 276 MB dependency layer is not re-uploaded.
          #
          # image-manifest + oci-mediatypes are what make GHCR accept a cache
          # manifest at all.
          cache-from: |
            type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }}
            type=gha,scope=${{ matrix.arch }}
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-${{ matrix.arch }},mode=max,image-manifest=true,oci-mediatypes=true
          # Nothing consumes the provenance attestation, and it costs an extra
          # manifest on every export and two "unknown/unknown" entries in the
          # manifest list the box pulls.
          provenance: false

      # One empty file per architecture, named after the digest. actions/upload-
      # artifact v4 refuses two uploads under one name, hence the -${arch}.
      - name: Name the digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    # This is the gate. `:latest` - the only thing the box ever pulls - comes
    # into existence here, and only if the tests passed and both architectures
    # built.
    needs: [test, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digest-*
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - working-directory: ${{ runner.temp }}/digests
        run: |
          set -eux
          test "$(ls | wc -l)" -eq 2   # both architectures, or no tag
          docker buildx imagetools create -t "$IMAGE:latest" \
            $(printf "$IMAGE@sha256:%s " *)
          docker buildx imagetools inspect "$IMAGE:latest"
