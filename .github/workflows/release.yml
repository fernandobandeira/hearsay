# Build the multi-arch image on every push to master and publish it to GHCR.
# Both architectures build natively (GitHub's free arm64 runners for public
# repos) - no QEMU, so the Rust + whisper.cpp compile stays fast. The box then
# deploys with a plain `docker pull ghcr.io/fernandobandeira/hearsay:latest`.
name: release

on:
  push:
    branches: [master]
    # The reader has its own image and its own workflow (web.yml). A UI-only
    # push has no business spending an hour recompiling whisper.cpp twice - and
    # the box would not pick the result up anyway: it reads the reader from the
    # hearsay-web image, not from this one. The server image still *builds*
    # web/ (its Dockerfile's node stage), so the fallback baked into it is
    # whatever the tree held at the last server build. That is the point of a
    # fallback.
    paths-ignore:
      - 'web/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The reader too: the server image's node stage builds web/, so a reader
      # that does not typecheck is a server image that does not build.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci --no-audit --no-fund
      - run: npm --prefix web test
      - run: npm --prefix web exec -- tsc -b --force

  build:
    # A failing test must block the publish - the image only builds on green.
    needs: [test]
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:latest-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}

  publish:
    needs: [build]
    runs-on: ubuntu-24.04
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          docker buildx imagetools create -t "$IMAGE:latest" \
            "$IMAGE:latest-amd64" "$IMAGE:latest-arm64"
          docker buildx imagetools inspect "$IMAGE:latest"
