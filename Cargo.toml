[package]
name = "narrator"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "Self-hosted TTS book reader — the Rust server"

[dependencies]
anyhow = "1"
async-stream = "0.3"
axum = { version = "0.8", features = ["macros", "http2"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
epub = "2.1"
# The text bundle is pre-gzipped at build time: written once per load, read by
# every device over a tunnel for the life of the book.
flate2 = "1"
futures-core = "0.3"
hound = "3"
mime_guess = "2"
ndarray = "0.16"
notify = "8"
# Years, for the text normalizer: `1066` is "ten sixty-six", not "one thousand
# sixty six". The same algorithm as the Python package misaki imports, and
# verified byte-identical to it for every year from 1000 to 2100.
num2words = "1.2"
ort = { version = "=2.0.0-rc.10", features = ["ndarray", "download-binaries"] }
percent-encoding = "2"
# The durable-intent store (`src/store.rs`). `bundled` is not a convenience: the
# runtime image is `debian:bookworm-slim` with no libsqlite3 in it, and the build
# is multi-arch — linking the system library would make the image's contents a
# build-host detail on exactly the architecture that is hardest to test.
rusqlite = { version = "0.32", features = ["bundled"] }
scraper = "0.23"
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-general-category = "1"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
tokio-util = { version = "0.7", features = ["io"] }

[features]
default = ["stt"]
# The voice-memo transcriber: the vendored Phonon-2 engine, compiled by build.rs.
# Off, the binary still builds and every memo is refused with a 500 the
# reader's outbox keeps retrying.
stt = []

[build-dependencies]
cc = "1"

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
flate2 = "1"
futures-util = "0.3"
percent-encoding = "2"
tempfile = "3"
url = "2"

[profile.release]
opt-level = 3
