[package]
name = "narrator"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"

[dependencies]
thiserror = "2"
anyhow = "1"
hound = "3"
ndarray = "0.16"
ort = { version = "=2.0.0-rc.10", features = ["ndarray", "download-binaries"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
